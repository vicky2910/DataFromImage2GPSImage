<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>OCR + GPS Map Camera Combined</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 10px
        }

        .container {
            display: flex;
            gap: 12px;
            flex-wrap: wrap
        }

        .panel {
            flex: 1 1 650px;
            border: 1px solid #ccc;
            padding: 10px;
            box-sizing: border-box
        }

        button,
        input,
        textarea {
            padding: 8px;
            margin: 4px
        }

        textarea {
            box-sizing: border-box
        }

        #imageWrapper {
            position: relative;
            display: inline-block;
            border: 1px solid #ccc;
            max-width: 100%
        }

        #previewImage {
            display: block;
            max-width: 100%;
            user-select: none;
            -webkit-user-drag: none;
        }

        #selection {
            position: absolute;
            border: 2px dashed red;
            background: rgba(255, 0, 0, .15);
            display: none;
            pointer-events: none
        }

        .image-container {
            position: relative;
            display: inline-block;
            width: 540px
        }

        .main-image {
            width: 100%;
            height: 600px;
            object-fit: cover;
            background: #ddd
        }

        .map-overlay {
            position: absolute;
            bottom: 15px;
            left: 15px;
            width: 140px;
            height: 120px;
            border-radius: 10px;
            overflow: hidden;
            background: #fff;
            opacity: .90
        }

        #map {
            width: 100%;
            height: 100%
        }

        .overlay-text {
            position: absolute;
            bottom: 15px;
            right: 15px;
            color: #fff;
            text-align: right;
            text-shadow: 2px 2px 4px #000
        }

        .logo,
        .google-label {
            position: absolute;
            color: #fff;
            z-index: 1000;
            font-size: 10px;
            text-shadow: 1px 1px 2px #000
        }

        .logo {
            top: 4px;
            left: 6px
        }

        .google-label {
            bottom: 4px;
            left: 6px
        }


        .box {
            margin-top: 15px;
            width: 5cap;
        }

        .box label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>

    <div class="container">
        <h2 style="text-align: center; width: 100%;">Web Page to Extra Data for Image and Generate GPS Tagged Image</h2>
        <div class="panel">
            <h3>Upload Pic to Extract Data - OCR Section</h3>
            <input type="file" id="imageInput" accept="image/*">

            <br>
            <div id="imageWrapper">
                <img id="previewImage">
                <div id="selection"></div>
            </div>
            <br>
            <button onclick="readSelectedArea()">Read Selected Area</button>
            <button onclick="sendToGPS()">Send Data to GPS Image Generator</button>

            <div id="status"></div>
            <progress id="progressBar" value="0" max="100" style="width:100%;display:none"></progress>


            <div class="box">
                <label>Date & Time</label>
                <textarea id="dateTimeBox" rows="1" style="width: 500px;"></textarea>
            </div>

            <div class="box">
                <label>Coordinates</label>
                <textarea id="coordinateBox" style="width: 500px;" rows="1"></textarea>
            </div>

            <div class="box">
                <label>Address</label>
                <textarea id="addressBox" rows="6" style="width: 500px;"></textarea>
            </div>

        </div>

        <div class="panel">
            <h3>GPS Image Generator Section</h3>

            <input type="file" id="imageUpload" accept="image/*" onchange="loadImage(event)"><br>
            <label>Date & Time</label> <br>
            <input type="text" id="dateTime" style="width:500px" placeholder="Date Time"><br>
            <label>Coordinates</label><br>
            <input type="text" id="coordinates" style="width:500px" placeholder="Coordinates"><br>

            <label>Address</label><br>
            <textarea id="address" rows="4" style="width:520px" placeholder="Address"></textarea><br>

            <button onclick="loadLocation()">Update GPS Details</button><br>


            <div class="image-container" id="captureArea">
                <img class="main-image" id="uploadImg">
                <div class="map-overlay">
                    <div class="logo">📍 GPS Map Camera</div>
                    <div id="map"></div>
                    <div class="google-label">Google</div>
                </div>
                <div class="overlay-text" id="locationInfo">GPS Details Loading..</div>
            </div>
            <br>
            <button onclick="takeScreenshot()">Take Screenshot of GPS Image</button>
        </div>


    </div>

    <script>
        function sendToGPS() {
            dateTime.value = dateTimeBox.value;
            coordinates.value = coordinateBox.value;
            address.value = addressBox.value;
            alert("Data Transferred To GPS Image Generator ");
        }

        // OCR

        const imageInput =
            document.getElementById("imageInput");

        const image =
            document.getElementById("previewImage");

        const selection =
            document.getElementById("selection");

        const selectionInfo =
            document.getElementById("selectionInfo");

        let isDrawing = false;

        let startX = 0;
        let startY = 0;

        let selectionX = 0;
        let selectionY = 0;
        let selectionWidth = 0;
        let selectionHeight = 0;

        imageInput.addEventListener(
            "change",
            function (e) {

                const file =
                    e.target.files[0];

                if (!file) return;

                image.src =
                    URL.createObjectURL(file);

                selection.style.display =
                    "none";

                clearBoxes();
            }
        );

        image.addEventListener(
            "mousedown",
            function (e) {

                if (!image.src) return;

                const rect =
                    image.getBoundingClientRect();

                isDrawing = true;

                startX =
                    e.clientX - rect.left;

                startY =
                    e.clientY - rect.top;

                selection.style.display =
                    "block";

                selection.style.left =
                    startX + "px";

                selection.style.top =
                    startY + "px";

                selection.style.width = "0px";
                selection.style.height = "0px";
            }
        );

        image.addEventListener(
            "mousemove",
            function (e) {

                if (!isDrawing) return;

                const rect =
                    image.getBoundingClientRect();

                const currentX =
                    e.clientX - rect.left;

                const currentY =
                    e.clientY - rect.top;

                const left =
                    Math.min(startX, currentX);

                const top =
                    Math.min(startY, currentY);

                const width =
                    Math.abs(currentX - startX);

                const height =
                    Math.abs(currentY - startY);

                selection.style.left =
                    left + "px";

                selection.style.top =
                    top + "px";

                selection.style.width =
                    width + "px";

                selection.style.height =
                    height + "px";
            }
        );

        document.addEventListener(
            "mouseup",
            function (e) {

                if (!isDrawing) return;

                isDrawing = false;

                const rect =
                    image.getBoundingClientRect();

                const endX =
                    e.clientX - rect.left;

                const endY =
                    e.clientY - rect.top;

                selectionX =
                    Math.min(startX, endX);

                selectionY =
                    Math.min(startY, endY);

                selectionWidth =
                    Math.abs(endX - startX);

                selectionHeight =
                    Math.abs(endY - startY);

                selectionInfo.innerHTML =
                    `X=${Math.round(selectionX)},
             Y=${Math.round(selectionY)},
             Width=${Math.round(selectionWidth)},
             Height=${Math.round(selectionHeight)}`;
            }
        );

        function clearBoxes() {

            dateTimeBox.value = "";
            coordinateBox.value = "";
            addressBox.value = "";
        }

        function splitOCRData(text) {

            let dateTime = "";
            let coordinates = "";
            let address = text;

            // Date formats
            const dateRegex =
                /((?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*,?\s*\d{1,2}\/\d{1,2}\/\d{4}\s+\d{1,2}:\d{2}\s*(?:AM|PM)\s*GMT\s*[+-]\d{2}:\d{2}|\d{1,2}[\/\-]\d{1,2}[\/\-]\d{2,4}[\s,]*\d{1,2}:\d{2}(?::\d{2})?|\d{1,2}\s+[A-Za-z]{3,9}\s+\d{4}\s+\d{1,2}:\d{2}(?::\d{2})?)/i;

            const dateMatch =
                address.match(dateRegex);

            if (dateMatch) {

                dateTime = dateMatch[0];

                address =
                    address.replace(
                        dateMatch[0],
                        ""
                    );
            }

            // Decimal coordinates
            // Existing coordinate formats
            let coordinateRegex =
                /-?\d{1,2}\.\d+\s*[NS]?[,\s]+\s*-?\d{1,3}\.\d+\s*[EW]?/i;

            let coordinateMatch =
                address.match(coordinateRegex);

            if (coordinateMatch) {

                coordinates =
                    coordinateMatch[0];

                address =
                    address.replace(
                        coordinateMatch[0],
                        ""
                    );
            }
            else {

                // Additional format:
                // Lat 33.94357° Long 74.931431°
                // LAT:33.94357 LONG:74.931431
                // Lat 33.94357 Long 74.931431

                coordinateRegex =
                    /Lat[:\s]*([+-]?\d+\.\d+)°?\s*Long[:\s]*([+-]?\d+\.\d+)°?/i;

                coordinateMatch =
                    address.match(coordinateRegex);

                if (coordinateMatch) {

                    coordinates =
                        `${coordinateMatch[1]}, ${coordinateMatch[2]}`;

                    address =
                        address.replace(
                            coordinateMatch[0],
                            ""
                        );
                }
            }

            address =
                address
                    .replace(/\n{2,}/g, "\n")
                    .trim();

            document.getElementById(
                "dateTimeBox"
            ).value = dateTime;

            document.getElementById(
                "coordinateBox"
            ).value = coordinates;

            document.getElementById(
                "addressBox"
            ).value = address;
        }

        async function readSelectedArea() {

            if (!image.src) {

                alert("Upload image first");
                return;
            }

            if (
                selectionWidth < 5 ||
                selectionHeight < 5
            ) {

                alert(
                    "Select an area first"
                );

                return;
            }

            const scaleX =
                image.naturalWidth /
                image.clientWidth;

            const scaleY =
                image.naturalHeight /
                image.clientHeight;

            const cropX =
                selectionX * scaleX;

            const cropY =
                selectionY * scaleY;

            const cropWidth =
                selectionWidth * scaleX;

            const cropHeight =
                selectionHeight * scaleY;

            const canvas =
                document.createElement("canvas");

            const ctx =
                canvas.getContext("2d");

            canvas.width =
                cropWidth;

            canvas.height =
                cropHeight;

            ctx.drawImage(
                image,
                cropX,
                cropY,
                cropWidth,
                cropHeight,
                0,
                0,
                cropWidth,
                cropHeight
            );

            document.getElementById(
                "progressBar"
            ).style.display =
                "block";

            document.getElementById(
                "status"
            ).innerHTML =
                "Reading text...";

            try {

                const result =
                    await Tesseract.recognize(
                        canvas,
                        "eng",
                        {
                            logger: m => {

                                if (
                                    m.status ===
                                    "recognizing text"
                                ) {

                                    const p =
                                        Math.round(
                                            m.progress * 100
                                        );

                                    progressBar.value =
                                        p;

                                    status.innerHTML =
                                        "Processing " +
                                        p +
                                        "%";
                                }
                            }
                        }
                    );

                splitOCRData(
                    result.data.text
                );

                status.innerHTML =
                    "Completed";

            } catch (err) {

                console.error(err);

                status.innerHTML =
                    "OCR Failed";

                alert(
                    "Unable to read text."
                );
            }
        }


        // GPS Code 2


        let map;
        let marker;

        function initializeMap() {

            map = L.map('map', {
                zoomControl: false,
                attributionControl: false,
                dragging: false,
                scrollWheelZoom: false,
                doubleClickZoom: false,
                boxZoom: false,
                keyboard: false
            });

            map.setView([22.7196, 75.8577], 18);

            L.tileLayer(
                'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
                {
                    maxZoom: 20
                }
            ).addTo(map);

            marker = L.circleMarker(
                [22.7196, 75.8577],
                {
                    radius: 6,
                    fillColor: "#ff0000",
                    color: "#ffffff",
                    weight: 2,
                    fillOpacity: 1
                }
            ).addTo(map);
        }

        function loadImage(event) {

            const file =
                event.target.files[0];

            if (!file) return;

            uploadImg.src =
                URL.createObjectURL(file);
        }

        function dmsToDecimal(
            deg,
            min,
            sec,
            direction
        ) {

            let decimal =
                parseFloat(deg) +
                parseFloat(min || 0) / 60 +
                parseFloat(sec || 0) / 3600;

            if (
                direction === "S" ||
                direction === "W"
            ) {
                decimal *= -1;
            }

            return decimal;
        }

        function parseCoordinates(input) {

            input = input.trim();

            let m =
                input.match(
                    /^\s*(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)\s*$/
                );

            if (m) {
                return {
                    lat: parseFloat(m[1]),
                    lng: parseFloat(m[2])
                };
            }

            m =
                input.match(
                    /^\s*(\d+(?:\.\d+)?)\s*([NS])\s*[,\s]+\s*(\d+(?:\.\d+)?)\s*([EW])\s*$/i
                );

            if (m) {

                let lat =
                    parseFloat(m[1]);

                let lng =
                    parseFloat(m[3]);

                if (
                    m[2].toUpperCase() === "S"
                ) lat *= -1;

                if (
                    m[4].toUpperCase() === "W"
                ) lng *= -1;

                return {
                    lat,
                    lng
                };
            }

            m =
                input.match(
                    /(\d+)[°º]\s*(\d+)[′']\s*(\d+(?:\.\d+)?)[″"]\s*([NS])\s*,?\s*(\d+)[°º]\s*(\d+)[′']\s*(\d+(?:\.\d+)?)[″"]\s*([EW])/i
                );

            if (m) {

                return {
                    lat: dmsToDecimal(
                        m[1],
                        m[2],
                        m[3],
                        m[4].toUpperCase()
                    ),
                    lng: dmsToDecimal(
                        m[5],
                        m[6],
                        m[7],
                        m[8].toUpperCase()
                    )
                };
            }

            return null;
        }

        function formatDateTime(input) {

            input = input.trim();

            const months = [
                "Jan", "Feb", "Mar", "Apr",
                "May", "Jun", "Jul", "Aug",
                "Sep", "Oct", "Nov", "Dec"
            ];



            // Tuesday, 05/05/2026 02:07 PM GMT +05:30

            let m = input.match(
                /(?:Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday)\s*,?\s*(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})\s*(AM|PM)/i
            );

            if (m) {

                const months = [
                    "January", "February", "March", "April",
                    "May", "June", "July", "August",
                    "September", "October", "November", "December"
                ];

                let day = m[1].padStart(2, "0");
                let month = months[parseInt(m[2]) - 1];
                let year = m[3];

                let hour = parseInt(m[4]);
                let minute = m[5];
                let ampm = m[6].toUpperCase();

                if (ampm === "PM" && hour !== 12)
                    hour += 12;

                if (ampm === "AM" && hour === 12)
                    hour = 0;

                return `${day} ${month} ${year} ${String(hour).padStart(2, "0")}:${minute}:00`;
            }

            // DD.MM.YYYY HH:MM:SS
            m = input.match(
                /^(\d{1,2})\.(\d{1,2})\.(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/
            );

            if (m) {

                const day = m[1].padStart(2, "0");
                const month = months[parseInt(m[2]) - 1];
                const year = m[3];

                const hh = m[4].padStart(2, "0");
                const mm = m[5];
                const ss = m[6];

                return `${day} ${month} ${year} ${hh}:${mm}:${ss}`;
            }

            // DD/MM/YYYY HH:MM:SS
            m = input.match(
                /^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/
            );

            if (m) {

                const day = m[1].padStart(2, "0");
                const month = months[parseInt(m[2]) - 1];
                const year = m[3];

                return `${day} ${month} ${year} ${m[4].padStart(2, "0")}:${m[5]}:${m[6]}`;
            }

            // DD-MM-YYYY HH:MM:SS
            m = input.match(
                /^(\d{1,2})-(\d{1,2})-(\d{4})\s+(\d{1,2}):(\d{2}):(\d{2})$/
            );

            if (m) {

                const day = m[1].padStart(2, "0");
                const month = months[parseInt(m[2]) - 1];
                const year = m[3];

                return `${day} ${month} ${year} ${m[4].padStart(2, "0")}:${m[5]}:${m[6]}`;
            }

            // Already in desired format
            m = input.match(
                /^(\d{1,2})\s+[A-Za-z]{3,9}\s+\d{4}\s+\d{1,2}:\d{2}:\d{2}$/
            );

            if (m) {
                return input;
            }

            // Unknown format
            return input;
        }


        async function loadLocation() {

            const parsed =
                parseCoordinates(
                    coordinates.value
                );

            if (!parsed) {

                alert(
                    "Invalid coordinate format"
                );

                return;
            }

            const lat =
                parsed.lat;

            const lng =
                parsed.lng;

            let displayDate =
                formatDateTime(
                    document.getElementById("dateTime").value
                );

            locationInfo.innerHTML =
                `
    <div>${displayDate}</div>
    <div>
        ${Math.abs(lat).toFixed(6)}${lat >= 0 ? "N" : "S"},
        ${Math.abs(lng).toFixed(6)}${lng >= 0 ? "E" : "W"}
    </div>
    <div>
        ${address.value.replace(/\n/g, "<br>")}
    </div>
`;

            map.setView(
                [lat, lng],
                18
            );

            marker.setLatLng(
                [lat, lng]
            );

            setTimeout(() => {
                map.invalidateSize();
            }, 300);
        }

        function takeScreenshot() {

            html2canvas(
                document.getElementById(
                    "captureArea"
                ),
                {
                    useCORS: true,
                    allowTaint: true,
                    scale: 2
                }
            )
                .then(canvas => {

                    const now =
                        new Date();

                    const fileName =
                        `GPS_Image_${now.getFullYear()}${String(now.getMonth() + 1).padStart(2, "0")}${String(now.getDate()).padStart(2, "0")}_${String(now.getHours()).padStart(2, "0")}${String(now.getMinutes()).padStart(2, "0")}${String(now.getSeconds()).padStart(2, "0")}.png`;

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.download =
                        fileName;

                    link.href =
                        canvas.toDataURL(
                            "image/png"
                        );

                    link.click();
                });
        }

        function setCurrentDateTime() {

            const now =
                new Date();

            const year =
                now.getFullYear();

            const month =
                String(
                    now.getMonth() + 1
                ).padStart(2, "0");

            const day =
                String(
                    now.getDate()
                ).padStart(2, "0");

            const hours =
                String(
                    now.getHours()
                ).padStart(2, "0");

            const mins =
                String(
                    now.getMinutes()
                ).padStart(2, "0");

            const secs =
                String(
                    now.getSeconds()
                ).padStart(2, "0");

            dateTime.value =
                `${year}-${month}-${day}T${hours}:${mins}:${secs}`;
        }

        initializeMap();

    </script>
</body>

</html>
